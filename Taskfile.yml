# delorean — every command of the repository, from its root.
#   task --list
version: "3"

includes:
  quoter:
    taskfile: ./quoter/Taskfile.yml
    dir: ./quoter

tasks:
  setup:
    desc: Dependencies of every part (the quoter, web, e2e)
    cmds:
      - task: quoter:setup
      - cd web && npm ci
      - cd e2e && npm ci

  generate:
    desc: Code generated from api/openapi.yaml, in every part
    cmds:
      - task: quoter:generate
      - cd web && npm run generate
      - cd e2e && npm run generate

  lint:
    desc: Linters and type checks of every part
    cmds:
      - task: quoter:lint
      - cd web && npm run lint && npm run typecheck
      - cd e2e && npm run lint && npm run typecheck && npm run format:check

  test:
    desc: Unit tests of every part — no model is called
    cmds:
      - task: quoter:test
      - cd web && npm test
      - cd e2e && npm test

  e2e:
    desc: The end-to-end suite against the quoter on its fake engines (:24799)
    cmds: [scripts/e2e-fake.sh]

  web:e2e:
    desc: The web app in a browser (Playwright, desktop and mobile) against the whole stack on fake engines, in Docker
    cmds: ["scripts/web-e2e.sh {{.CLI_ARGS}}"]

  ci:
    desc: What CI runs
    cmds:
      - task: lint
      - task: test
      - task: e2e

  up:
    desc: "The stack in Docker: web :24790, quoter :24793, docs :24795; fake engines unless ENGINES=live"
    cmds: [docker compose up --build]

  down:
    desc: Stop the stack
    cmds: [docker compose down]

  docs:
    desc: The documentation site on http://localhost:24795, without Docker
    cmds: [scripts/docs.sh]

  langfuse:secrets:
    desc: Write the local Langfuse's passwords and keys into .env (never replaces a value)
    cmds: [scripts/langfuse-secrets.sh]

  langfuse:up:
    desc: The local Langfuse (optional), http://localhost:24794 (project delorean)
    deps: [langfuse:secrets]
    cmds: [docker compose -f deploy/langfuse/compose.yml --env-file .env up -d --wait]

  langfuse:down:
    desc: Stop the local Langfuse (its data stays in Docker volumes)
    cmds: [docker compose -f deploy/langfuse/compose.yml --env-file .env down]

  langfuse:report:
    desc: "Quotes, cost and latency (mean, median, p90), outcomes; task langfuse:report -- --from 2026-10-01"
    dir: e2e
    dotenv: [../.env]
    cmds: ['npm run --silent langfuse:report -- {{.CLI_ARGS}}']

  langfuse:dashboard:
    desc: "The Langfuse dashboard Quotes, made once; task langfuse:dashboard -- --replace draws it anew"
    dir: e2e
    dotenv: [../.env]
    cmds: ['npm run --silent langfuse:dashboard -- {{.CLI_ARGS}}']

  bench:
    desc: "System bench of the quoter: task bench -- --base-url http://localhost:24793 --runs 3"
    dir: e2e
    cmds: ['npm run bench -- {{.CLI_ARGS}}']
