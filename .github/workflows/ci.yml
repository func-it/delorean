name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated types match the contract
        run: npm run generate && git diff --exit-code
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          SESSION_SECRET: ci-only-secret-of-at-least-32-characters

  web-e2e:
    name: Web app end to end in a browser (Playwright, the whole stack on fake engines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Playwright against the stack (scripts/web-e2e.sh)
        run: scripts/web-e2e.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  e2e:
    name: End-to-end harness (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - name: Generated types match the contract
        working-directory: e2e
        run: npm run generate && git diff --exit-code
      - name: Harness lint, types and tests
        working-directory: e2e
        run: npm run lint && npm run typecheck && npm run format:check && npm test

  typescript:
    name: Quoter (TypeScript), and the end-to-end suite against it (fake engines)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quoter
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            quoter/package-lock.json
            e2e/package-lock.json
      - run: npm ci
      - name: Generated types match the contract
        run: npm run generate && git diff --exit-code
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - name: Tests (no model called)
        run: npm test
      - run: npm ci
        working-directory: e2e
      - name: Suite against the quoter
        run: scripts/e2e-fake.sh
      - name: Image builds
        working-directory: .
        run: docker build -f quoter/Dockerfile -t delorean-quoter:ci .
