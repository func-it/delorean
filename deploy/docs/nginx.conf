# The documentation site: the static pages, and the repository files they
# read (README, docs, contract) under /content/, mounted one by one so that
# nothing else of the repository is served.
server {
    listen 80;
    server_name localhost;
    charset utf-8;
    charset_types text/plain text/css application/javascript;

    root /usr/share/nginx/html;
    index index.html;
    # the pages change with the repository: revalidate on every load
    add_header Cache-Control "no-cache";

    location /content/ {
        alias /usr/share/nginx/content/;
        default_type text/plain;
        add_header Cache-Control "no-store";
    }
}
