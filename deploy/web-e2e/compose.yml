# The stack the web app's Playwright suite runs against (scripts/web-e2e.sh),
# on top of compose.yml: fake engines, no key, and no port on the host, so
# that it never meets a stack already running there. Playwright reaches the
# web app on the project's network.
services:
  quoter:
    environment:
      OPENROUTER_API_KEY: ""
    ports: !reset []
  web:
    environment:
      DAILY_BUDGET_USD: "0"
      # every test is a new visitor from the same address: room for a parallel run
      IP_MAX_IN_FLIGHT: "50"
      IP_STRIKE_LIMIT: "1000"
      # and from the same address for the rate and the per-address budget too
      IP_RATE_LIMIT: "100000"
      IP_DAILY_BUDGET_USD: "0"
    ports: !reset []
    volumes: !reset []
  docs:
    profiles: [never]
