# delorean — the Go implementation of api/openapi.yaml.
version: "3"

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -s -w -X main.version={{.VERSION}}
  IMAGE: delorean-go

tasks:
  generate:
    desc: The server and the models, from api/openapi.yaml
    cmds: [go generate ./...]
    sources: [../../api/openapi.yaml, internal/httpapi/oapi-codegen.yaml]
    generates: [internal/httpapi/openapi.gen.go]

  lint:
    desc: golangci-lint
    cmds: [golangci-lint run ./...]

  test:
    desc: Vet and tests, race detector on; no model is called without RUN_LIVE=1
    cmds: [go vet ./..., go test -race ./...]

  run:
    desc: "The API on the live engines, :24791 (OPENROUTER_API_KEY, LANGFUSE_* from the root .env)"
    dotenv: [../../.env]
    cmds: ['go run -ldflags "{{.LDFLAGS}}" ./cmd/delorean serve']

  run:fake:
    desc: The API on the fake engines, :24791 — no key, no cost
    env: { ENGINES: fake }
    cmds: ['go run -ldflags "{{.LDFLAGS}}" ./cmd/delorean serve']

  build:
    desc: A static binary, bin/delorean
    env: { CGO_ENABLED: "0" }
    cmds: ['go build -trimpath -ldflags "{{.LDFLAGS}}" -o bin/delorean ./cmd/delorean']

  docker:
    desc: "The image {{.IMAGE}}:<version>"
    cmds: ["docker build --build-arg VERSION={{.VERSION}} -t {{.IMAGE}}:{{.VERSION}} -t {{.IMAGE}}:latest ."]
