# delorean — the quoter: the API of api/openapi.yaml, on Node.
# Included by the root Taskfile as quoter: task quoter:test, task quoter:run:fake…
version: "3"

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  IMAGE: delorean-quoter

tasks:
  setup:
    desc: Dependencies, as the lock file pins them
    cmds: [npm ci]

  generate:
    desc: The contract's types, from api/openapi.yaml
    cmds: [npm run generate]
    sources: [../api/openapi.yaml]
    generates: [src/generated/openapi.ts]

  lint:
    desc: ESLint, the type check and Prettier
    cmds: [npm run lint, npm run typecheck, npm run format:check]

  format:
    desc: Prettier, in place
    cmds: [npm run format]

  test:
    desc: Unit tests; no model is called
    cmds: [npm test]

  run:
    desc: "The API on the live engines, :24793 (OPENROUTER_API_KEY, LANGFUSE_* from the root .env)"
    dotenv: [../.env]
    env: { DELOREAN_VERSION: "{{.VERSION}}" }
    cmds: [node src/main.ts]

  run:fake:
    desc: The API on the fake engines, :24793 — no key, no cost
    env: { ENGINES: fake, DELOREAN_VERSION: "{{.VERSION}}" }
    cmds: [node src/main.ts]

  bench:stage:
    desc: "Each stage played alone, on the quoter's own engines: task quoter:bench:stage -- list | check | run guard --dry-run | matrix --dry-run"
    dotenv: [../.env]
    cmds: ['npm run --silent bench:stage -- {{.CLI_ARGS}}']

  docker:
    desc: "The image {{.IMAGE}}:<version>, built from the repository's root"
    dir: ../..
    cmds:
      - docker build -f quoter/Dockerfile --build-arg VERSION={{.VERSION}} -t {{.IMAGE}}:{{.VERSION}} -t {{.IMAGE}}:latest .
