# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/HEAD/configuration-schema.json
package: httpapi
output: openapi.gen.go
generate:
  std-http-server: true
  models: true
compatibility:
  always-prefix-enum-values: true
output-options:
  # Problem.tokens is an inline schema: named, it can be built without
  # repeating its struct tags.
  generate-types-for-anonymous-schemas: true
  # A JSON number of the contract is a float64; oapi-codegen defaults to float32.
  type-mapping:
    number:
      default:
        type: float64
    # A time is written as every quoter writes it: UTC, milliseconds (Instant).
    string:
      default:
        type: string
      formats:
        date-time:
          type: Instant
