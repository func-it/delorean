# golangci-lint v2. The standard linters, and a few that find bugs or dead
# weight rather than taste.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - misspell
    - noctx
    - nolintlint
    - sloglint
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    sloglint:
      kv-only: true
  exclusions:
    generated: strict
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/func-it/delorean
