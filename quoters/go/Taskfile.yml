# delorean — the Go implementation of api/openapi.yaml.
# Included by the root Taskfile as go: task go:test, task go:run:fake…
version: "3"

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -s -w -X main.version={{.VERSION}}
  IMAGE: delorean-go

tasks:
  setup:
    desc: Dependencies, as go.sum pins them
    cmds: [go mod download]

  generate:
    desc: The server and the models, from api/openapi.yaml
    cmds: [go generate ./...]
    sources: [../../api/openapi.yaml, internal/httpapi/oapi-codegen.yaml]
    generates: [internal/httpapi/openapi.gen.go]

  lint:
    desc: golangci-lint (gofmt included)
    cmds: [golangci-lint run ./...]

  format:
    desc: gofmt and golangci-lint's fixes
    cmds: [gofmt -w cmd internal, golangci-lint run --fix ./...]

  test:
    desc: Vet and tests, race detector on; no model is called without RUN_LIVE=1
    cmds: [go vet ./..., go test -race ./...]

  run:
    desc: "The API on the live engines, :24791 (OPENROUTER_API_KEY, LANGFUSE_* from the root .env)"
    dotenv: [../../.env]
    cmds: ['go run -ldflags "{{.LDFLAGS}}" ./cmd/delorean serve']

  run:fake:
    desc: The API on the fake engines, :24791 — no key, no cost
    env: { ENGINES: fake }
    cmds: ['go run -ldflags "{{.LDFLAGS}}" ./cmd/delorean serve']

  docker:
    desc: "The image {{.IMAGE}}:<version>, built from the repository's root (for prompts/)"
    cmds: ["docker build -f Dockerfile --build-arg VERSION={{.VERSION}} -t {{.IMAGE}}:{{.VERSION}} -t {{.IMAGE}}:latest ../.."]
