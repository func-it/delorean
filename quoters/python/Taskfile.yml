# delorean — the Python implementation of api/openapi.yaml, on uv.
# Included by the root Taskfile as py: task py:test, task py:run:fake…
version: "3"

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  IMAGE: delorean-python

tasks:
  setup:
    desc: Dependencies, as uv.lock pins them, and the tokenizer's vocabulary
    cmds:
      - uv sync --locked
      - task: tokenizer

  generate:
    desc: The contract's models, src/delorean/api/contract.py, from api/openapi.yaml (datamodel-code-generator)
    cmds: [uv run --locked datamodel-codegen]
    sources: [../../api/openapi.yaml, pyproject.toml]
    generates: [src/delorean/api/contract.py]

  tokenizer:
    # the o200k_base vocabulary into .tiktoken/, once, checked against its pinned SHA-256
    internal: true
    cmds: [uv run --locked delorean tokenizer]
    status: [test -n "$(ls .tiktoken 2>/dev/null)"]

  lint:
    desc: Ruff (lint and format) and mypy --strict
    cmds:
      - uv run --locked ruff check .
      - uv run --locked ruff format --check .
      - uv run --locked mypy

  format:
    desc: Ruff's fixes and format
    cmds:
      - uv run --locked ruff check --fix .
      - uv run --locked ruff format .

  test:
    desc: Unit tests; no model is called
    deps: [tokenizer]
    env: { OPENROUTER_API_KEY: "" }
    cmds: [uv run --locked pytest]

  run:
    desc: "The API on the live engines, :24792 (OPENROUTER_API_KEY, LANGFUSE_* from the root .env)"
    deps: [tokenizer]
    dotenv: [../../.env]
    env: { DELOREAN_VERSION: "{{.VERSION}}" }
    cmds: [uv run --locked delorean serve]

  run:fake:
    desc: The API on the fake engines, :24792 — no key, no cost
    deps: [tokenizer]
    env: { ENGINES: fake, OPENROUTER_API_KEY: "", DELOREAN_VERSION: "{{.VERSION}}" }
    cmds: [uv run --locked delorean serve]

  docker:
    desc: "The image {{.IMAGE}}:<version>, built from the repository's root"
    dir: ../..
    cmds:
      - docker build -f quoters/python/Dockerfile --build-arg VERSION={{.VERSION}} -t {{.IMAGE}}:{{.VERSION}} -t {{.IMAGE}}:latest .
