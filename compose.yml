# The whole stack, one command:
#   docker compose up --build                  # fake engines: no key, no cost (the default)
#   ENGINES=live DAILY_BUDGET_USD=5 docker compose up --build
#                                              # real models: OPENROUTER_API_KEY in .env, and a daily
#                                              # spending cap, without which the web app does not start
# Web app on http://localhost:24790, Go quoter on http://localhost:24791,
# documentation on http://localhost:24795.
#
# Each service is limited in memory and CPU, says when it is healthy (the web app
# waits for the quoters), and has time to finish its requests when stopped: a
# request is cut at 15 s (REQUEST_TIMEOUT) and the drain adds 5 s.
name: delorean

services:
  quoter-go:
    build:
      context: .
      dockerfile: quoters/go/Dockerfile
    environment:
      ENGINES: ${ENGINES:-fake}
      # the limits of a cart, one figure from the browser to the quoter (the same variables in the web app)
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-8192}
      MAX_INPUT_TOKENS: ${MAX_INPUT_TOKENS:-256}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      PARSE_MODEL: ${PARSE_MODEL:-openai/gpt-6-luna}
      PARSE_EFFORT: ${PARSE_EFFORT:-minimal}
      RECOUNT_MODEL: ${RECOUNT_MODEL:-openai/gpt-6-luna}
      RECOUNT_EFFORT: ${RECOUNT_EFFORT:-none}
      READ_ATTEMPTS: ${READ_ATTEMPTS:-3}
      JEV_MODEL: ${JEV_MODEL:-typesafe/jev-1.13}
      # traces go to the local Langfuse (deploy/langfuse), seen from the container
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_DOCKER_BASE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:24791:24791"
    mem_limit: 512m
    cpus: 1.5
    stop_grace_period: 25s
    healthcheck:
      test: ["CMD", "/usr/local/bin/delorean", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    # the least a process needs: no capability, no way to gain one, an image it cannot write to
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    restart: unless-stopped

  # The TypeScript implementation, the same contract on :24793. Built from the
  # repository's root: the image carries the shared prompts/.
  quoter-typescript:
    build:
      context: .
      dockerfile: quoters/typescript/Dockerfile
    environment:
      ENGINES: ${ENGINES:-fake}
      # the limits of a cart, one figure from the browser to the quoter (the same variables in the web app)
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-8192}
      MAX_INPUT_TOKENS: ${MAX_INPUT_TOKENS:-256}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      PARSE_MODEL: ${PARSE_MODEL:-openai/gpt-6-luna}
      PARSE_EFFORT: ${PARSE_EFFORT:-minimal}
      RECOUNT_MODEL: ${RECOUNT_MODEL:-openai/gpt-6-luna}
      RECOUNT_EFFORT: ${RECOUNT_EFFORT:-none}
      READ_ATTEMPTS: ${READ_ATTEMPTS:-3}
      JEV_MODEL: ${JEV_MODEL:-typesafe/jev-1.13}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_DOCKER_BASE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:24793:24793"
    mem_limit: 512m
    cpus: 1.5
    stop_grace_period: 25s
    healthcheck:
      test: ["CMD", "node", "src/main.ts", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    # the least a process needs: no capability, no way to gain one, an image it cannot write to
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    restart: unless-stopped

  # The Python implementation, the same contract on :24792. Built from the
  # repository's root: the image carries the shared prompts/.
  quoter-python:
    build:
      context: .
      dockerfile: quoters/python/Dockerfile
    environment:
      ENGINES: ${ENGINES:-fake}
      # the limits of a cart, one figure from the browser to the quoter (the same variables in the web app)
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-8192}
      MAX_INPUT_TOKENS: ${MAX_INPUT_TOKENS:-256}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      PARSE_MODEL: ${PARSE_MODEL:-openai/gpt-6-luna}
      PARSE_EFFORT: ${PARSE_EFFORT:-minimal}
      RECOUNT_MODEL: ${RECOUNT_MODEL:-openai/gpt-6-luna}
      RECOUNT_EFFORT: ${RECOUNT_EFFORT:-none}
      READ_ATTEMPTS: ${READ_ATTEMPTS:-3}
      JEV_MODEL: ${JEV_MODEL:-typesafe/jev-1.13}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_DOCKER_BASE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:24792:24792"
    mem_limit: 512m
    cpus: 1.5
    stop_grace_period: 25s
    healthcheck:
      test: ["CMD", "delorean", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    # the least a process needs: no capability, no way to gain one, an image it cannot write to
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    restart: unless-stopped

  web:
    build:
      context: ./web
    environment:
      QUOTERS: '{"go":"http://quoter-go:24791","typescript":"http://quoter-typescript:24793","python":"http://quoter-python:24792"}'
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET (32+ characters) in .env}
      # served over plain HTTP on localhost: a Secure cookie would be dropped by some browsers
      SESSION_COOKIE_SECURE: "false"
      # the strike rule (web/README.md): injection refusals before a block (a session or a
      # username; an address), quotes in flight per address, the window and the block's length
      STRIKE_LIMIT: ${STRIKE_LIMIT:-3}
      IP_STRIKE_LIMIT: ${IP_STRIKE_LIMIT:-10}
      IP_MAX_IN_FLIGHT: ${IP_MAX_IN_FLIGHT:-4}
      STRIKE_WINDOW_S: ${STRIKE_WINDOW_S:-900}
      STRIKE_BLOCK_S: ${STRIKE_BLOCK_S:-900}
      REFUSAL_MEMORY_S: ${REFUSAL_MEMORY_S:-21600}
      # no proxy in front of the port published below; behind one that appends to X-Forwarded-For, 1
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      # daily spending cap in USD over the quoters' usage.cost_usd, UTC day; empty or 0 = no cap.
      # The running total survives restarts in the web-data volume.
      DAILY_BUDGET_USD: ${DAILY_BUDGET_USD:-0}
      # with ENGINES=live the web app refuses to start without a DAILY_BUDGET_USD above 0
      ENGINES: ${ENGINES:-fake}
      # the limits of a cart, one figure from the browser to the quoter (the same variables in the web app)
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-8192}
      MAX_INPUT_TOKENS: ${MAX_INPUT_TOKENS:-256}
      BUDGET_FILE: /data/budget.json
    volumes:
      - web-data:/data
    ports:
      - "127.0.0.1:24790:24790"
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 25s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:24790/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      quoter-go:
        condition: service_healthy
      quoter-typescript:
        condition: service_healthy
      quoter-python:
        condition: service_healthy
    # the least a process needs: no capability, no way to gain one, an image it cannot write to
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    # Next writes its fetch cache under .next/cache; the daily budget is on the web-data volume
    tmpfs: ["/tmp", "/app/.next/cache:uid=1000,gid=1000"]
    restart: unless-stopped

  # The documentation site, http://localhost:24795: the static pages and, under
  # /content/, only the repository files they read.
  docs:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    volumes:
      - ./deploy/docs/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docs/site:/usr/share/nginx/html:ro
      - ./README.md:/usr/share/nginx/content/README.md:ro
      - ./docs/architecture.md:/usr/share/nginx/content/architecture.md:ro
      - ./docs/testing.md:/usr/share/nginx/content/testing.md:ro
      - ./api/openapi.yaml:/usr/share/nginx/content/openapi.yaml:ro
    ports:
      - "127.0.0.1:24795:80"
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    # nginx starts as root to bind the port and hand its caches to its workers: those capabilities only
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp", "/run", "/var/cache/nginx"]
    restart: unless-stopped

volumes:
  web-data:

networks:
  default:
    driver_opts:
      # The network's MTU follows the host's uplink. On a host whose uplink has an
      # MTU of 1450 (a cloud private network), a Docker bridge left at 1500 sends
      # packets the path drops without a word: the answer to a TLS handshake
      # stalls for 3.6 s on about one connection in two, and the first call of
      # every cold connection to the models can outlast its MODEL_TIMEOUT.
      com.docker.network.driver.mtu: "${DOCKER_NETWORK_MTU:-1450}"
